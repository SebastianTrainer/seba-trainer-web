<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
<title>Seba Trainer</title>
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Seba Trainer" />
<meta name="theme-color" content="#09090b" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<link rel="icon" type="image/png" href="icons/favicon.png" />
<link rel="manifest" href="manifest.json" />
<style>
  :root{
    --bg:#09090b; --surface:#18181b; --surface2:#0f0f11; --border:#27272a;
    --text:#f4f4f5; --muted:#a1a1aa; --muted2:#71717a; --lime:#a3e635; --orange:#f97316;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;overscroll-behavior:none;}
  #root{min-height:100vh;}
  button{-webkit-user-select:none;user-select:none;touch-action:manipulation;}
  button:active{transform:scale(0.97);}
  img{-webkit-touch-callout:none;}
  .wrap{min-height:100vh;width:100%;display:flex;align-items:flex-start;justify-content:center;padding:24px 12px;}
  .phone{width:100%;max-width:420px;background:var(--surface);border:6px solid var(--border);border-radius:2.5rem;box-shadow:0 25px 60px rgba(0,0,0,.6);overflow:hidden;display:flex;flex-direction:column;height:860px;}
  .notch-row{background:var(--surface);padding:12px 0 4px;display:flex;justify-content:center;}
  .notch{width:96px;height:20px;background:var(--surface2);border-radius:999px;}
  .header{padding:8px 20px 16px;background:var(--surface);border-bottom:1px solid var(--border);}
  .brand-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
  .header-right{display:flex;align-items:center;gap:8px;}
  .ig-link{display:flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:8px;color:var(--muted2);border:1px solid var(--border);flex-shrink:0;}
  .ig-link svg{width:14px;height:14px;}
  .ig-link:active{color:var(--lime);border-color:#a3e63566;}
  .brand{display:flex;align-items:center;gap:8px;}
  .brand img{width:34px;height:34px;border-radius:9px;object-fit:cover;flex-shrink:0;}
  .brand h1{font-size:19px;font-weight:800;letter-spacing:.03em;color:#fafafa;margin:0;text-transform:uppercase;line-height:1.1;}
  .quota-tag{font-size:9px;color:var(--muted2);border:1px solid var(--border);border-radius:999px;padding:2px 8px;white-space:nowrap;display:flex;align-items:center;gap:4px;}
  .quota-tag.live{color:var(--lime);border-color:#a3e63566;}
  .live-dot{width:6px;height:6px;border-radius:999px;background:var(--lime);flex-shrink:0;}
  .toggle{position:relative;display:flex;background:var(--surface2);border-radius:999px;padding:4px;border:1px solid var(--border);}
  .toggle-slide{position:absolute;top:4px;bottom:4px;width:calc(50% - 4px);border-radius:999px;transition:left .25s ease, background .25s ease;}
  .toggle-slide.entrenador{left:4px;background:var(--orange);}
  .toggle-slide.usuario{left:calc(50% + 0px);background:var(--lime);}
  .toggle-btn{position:relative;z-index:1;flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:9px 0;border-radius:999px;font-size:14px;font-weight:600;background:transparent;border:none;color:var(--muted2);cursor:pointer;}
  .toggle-btn.active{color:#09090b;}
  .content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;}
  .content::-webkit-scrollbar{width:0;}
  .section{padding:16px;display:flex;flex-direction:column;gap:12px;}
  .section-label{font-size:11px;color:var(--muted2);text-transform:uppercase;letter-spacing:.05em;padding:0 4px;}
  .flash{font-size:12px;font-weight:600;color:var(--lime);transition:opacity .2s;}
  .day-card{background:var(--surface2);border:1px solid var(--border);border-radius:16px;overflow:hidden;}
  .day-head{width:100%;display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:transparent;border:none;cursor:pointer;color:inherit;}
  .day-title{display:flex;align-items:center;gap:10px;}
  .day-name{font-size:17px;font-weight:800;text-transform:uppercase;letter-spacing:.02em;color:#f4f4f5;}
  .day-badge{font-size:11px;color:var(--muted2);background:var(--bg);padding:2px 8px;border-radius:999px;}
  .day-body{padding:0 16px 16px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:8px;padding-top:12px;}
  .empty-italic{font-size:13px;color:#52525b;font-style:italic;padding-bottom:4px;}
  .ex-row{display:flex;align-items:flex-start;justify-content:space-between;background:var(--bg);border:1px solid #27272a99;border-radius:12px;padding:10px 12px;}
  .ex-left{display:flex;gap:10px;}
  .ex-thumb{width:40px;height:40px;border-radius:8px;object-fit:cover;border:1px solid var(--border);flex-shrink:0;}
  .ex-name{font-size:14px;font-weight:600;color:#f4f4f5;margin:0;}
  .ex-meta{font-family:ui-monospace,'SFMono-Regular',Menlo,monospace;font-size:12px;color:var(--muted2);margin:2px 0 0;}
  .ex-notes{font-size:12px;color:#52525b;margin:4px 0 0;}
  .ex-comment{font-size:12px;color:var(--lime);margin:6px 0 0;display:flex;gap:5px;align-items:flex-start;background:#a3e63514;border-radius:8px;padding:6px 8px;}
  .ex-comment svg{flex-shrink:0;margin-top:1px;}
  .ex-actions{display:flex;gap:2px;flex-shrink:0;}
  .icon-btn{background:transparent;border:none;color:var(--muted2);padding:6px;cursor:pointer;border-radius:8px;}
  .icon-btn:hover{color:var(--lime);}
  .icon-btn.danger:hover{color:var(--orange);}
  .icon-btn.accent{color:var(--lime);}
  .btn-add{width:100%;display:flex;align-items:center;justify-content:center;gap:6px;font-size:14px;font-weight:700;color:#09090b;background:var(--lime);border:none;border-radius:12px;padding:10px 0;margin-top:4px;cursor:pointer;}
  .form-card{background:var(--bg);border:1px solid #3f3f46;border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;}
  .form-input,.form-select{width:100%;background:var(--surface2);color:#f4f4f5;font-size:14px;border-radius:10px;padding:9px 12px;outline:none;border:1px solid var(--border);font-family:inherit;}
  .form-select{appearance:none;-webkit-appearance:none;}
  .form-input:focus,.form-select:focus{border-color:var(--lime);}
  .form-grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
  .mono-input{font-family:ui-monospace,'SFMono-Regular',Menlo,monospace;}
  .photo-row{display:flex;align-items:center;gap:8px;}
  .photo-upload-label{position:relative;display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);border:1px dashed #3f3f46;border-radius:10px;padding:10px 14px;cursor:pointer;overflow:hidden;}
  .photo-upload-label:hover{border-color:var(--lime);}
  .photo-upload-label input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;}
  .photo-thumb-wrap{position:relative;display:inline-block;}
  .photo-thumb{width:56px;height:56px;border-radius:10px;object-fit:cover;border:1px solid var(--border);}
  .photo-remove{position:absolute;top:-6px;right:-6px;background:var(--surface2);border:1px solid #3f3f46;border-radius:999px;padding:2px;color:var(--muted);cursor:pointer;display:flex;}
  .form-actions{display:flex;gap:8px;padding-top:2px;}
  .btn-primary{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;background:var(--lime);color:#09090b;font-size:14px;font-weight:700;border:none;border-radius:10px;padding:10px 0;cursor:pointer;}
  .btn-primary:disabled{background:#27272a;color:#52525b;cursor:not-allowed;}
  .btn-ghost{padding:0 14px;display:flex;align-items:center;justify-content:center;color:var(--muted2);border:1px solid var(--border);border-radius:10px;background:transparent;cursor:pointer;}
  .add-user-row{display:flex;flex-direction:column;gap:8px;}
  .btn-square{background:var(--lime);color:#09090b;border:none;border-radius:12px;padding:10px 0;display:flex;align-items:center;justify-content:center;gap:6px;font-size:14px;font-weight:700;cursor:pointer;}
  .btn-square:disabled{background:#27272a;color:#52525b;}
  .user-list{display:flex;flex-direction:column;gap:6px;max-height:420px;overflow-y:auto;padding-right:2px;}
  .user-item{display:flex;align-items:center;justify-content:space-between;background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:10px 12px;gap:6px;}
  .user-item-left{display:flex;align-items:center;gap:10px;min-width:0;}
  .user-avatar{width:28px;height:28px;border-radius:999px;background:var(--border);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--lime);flex-shrink:0;}
  .user-name{font-size:14px;color:#e4e4e7;}
  .user-sub{font-size:11px;color:var(--muted2);margin:1px 0 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .empty-box{background:var(--surface2);border:1px dashed var(--border);border-radius:16px;padding:22px;text-align:center;}
  .empty-box p{font-size:13px;color:var(--muted2);margin:0;}
  .hello-row{display:flex;align-items:center;justify-content:space-between;padding:12px 16px 0;}
  .hello-text{font-size:14px;color:#d4d4d8;margin:0;}
  .hello-name{color:var(--lime);font-weight:700;}
  .switch-btn{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--muted2);border:1px solid var(--border);border-radius:999px;padding:5px 10px;background:transparent;cursor:pointer;}
  .week-card{background:var(--surface2);border:1px solid var(--border);border-radius:16px;padding:16px;}
  .week-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
  .week-days{display:flex;justify-content:space-between;gap:6px;}
  .day-dot{flex:1;height:36px;border-radius:8px;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;background:transparent;color:#52525b;cursor:pointer;}
  .day-dot.active-border{border-color:var(--lime);}
  .day-dot.filled{background:var(--lime);color:#09090b;}
  .day-dot.partial{background:#f9731633;color:#fb923c;}
  .day-dot.has-routine{border-color:#ff5c5c;color:#ff8080;}
  .day-title-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;padding:0 4px;}
  .day-title-big{font-size:24px;font-weight:800;text-transform:uppercase;color:#fafafa;margin:0;}
  .checklist{display:flex;flex-direction:column;gap:8px;}
  .check-item{border-radius:12px;border:1px solid var(--border);background:var(--surface2);overflow:hidden;}
  .check-item.done{background:#a3e6351a;border-color:#a3e63566;}
  .check-toggle{width:100%;display:flex;align-items:center;gap:12px;padding:12px 14px;border:none;background:transparent;text-align:left;cursor:pointer;color:inherit;}
  .check-circle{flex-shrink:0;width:24px;height:24px;border-radius:999px;border:2px solid #3f3f46;display:flex;align-items:center;justify-content:center;}
  .check-circle.on{background:var(--lime);border-color:var(--lime);color:#09090b;}
  .check-text .ex-name{font-size:14px;}
  .check-text .ex-name.done{color:#71717a;text-decoration:line-through;}
  .extra-row{padding:0 14px 12px 50px;display:flex;flex-direction:column;gap:8px;}
  .weight-row{display:flex;align-items:center;gap:8px;}
  .weight-row.set-done .weight-label{color:var(--lime);}
  .set-check-btn{width:22px;height:22px;flex-shrink:0;border-radius:999px;border:1.5px solid var(--border);background:transparent;color:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;}
  .set-check-btn svg{width:12px;height:12px;}
  .set-check-btn.on{background:var(--lime);border-color:var(--lime);color:#09090b;}
  .weight-label{font-size:11px;color:var(--muted2);white-space:nowrap;}
  .weight-input{width:96px;background:var(--bg);color:#e4e4e7;font-size:13px;border-radius:8px;padding:7px 10px;border:1px solid var(--border);outline:none;font-family:ui-monospace,'SFMono-Regular',Menlo,monospace;}
  .weight-input:focus{border-color:var(--lime);}
  .weight-unit{font-size:11px;color:var(--muted2);}
  .comment-input{width:100%;background:var(--bg);color:#e4e4e7;font-size:12px;border-radius:8px;padding:8px 10px;border:1px solid var(--border);outline:none;resize:vertical;min-height:44px;font-family:inherit;}
  .comment-input:focus{border-color:var(--lime);}
  .reset-row{padding-top:6px;}
  .btn-reset{width:100%;display:flex;align-items:center;justify-content:center;gap:6px;font-size:14px;font-weight:600;color:var(--muted2);border:1px solid var(--border);border-radius:12px;padding:10px 0;background:transparent;cursor:pointer;}
  .confirm-row{display:flex;gap:8px;}
  .btn-confirm{flex:1;font-size:14px;font-weight:700;color:#09090b;background:var(--orange);border:none;border-radius:12px;padding:10px 0;cursor:pointer;}
  .btn-cancel{padding:0 16px;font-size:14px;color:var(--muted2);border:1px solid var(--border);border-radius:12px;background:transparent;cursor:pointer;}
  .loading-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;color:#71717a;font-size:14px;}
  .editor-head{display:flex;align-items:center;gap:10px;padding:2px 4px 0;}
  .back-btn{background:var(--surface2);border:1px solid var(--border);color:var(--muted);border-radius:10px;padding:8px;display:flex;cursor:pointer;}
  .editor-title{font-size:18px;font-weight:800;color:#fafafa;margin:0;text-transform:uppercase;letter-spacing:.02em;}
  .auth-wrap{padding:28px 20px;display:flex;flex-direction:column;align-items:center;gap:16px;}
  .auth-logo{width:110px;height:110px;border-radius:20px;object-fit:cover;box-shadow:0 10px 30px rgba(0,0,0,.5);}
  .auth-title{font-size:20px;font-weight:800;color:#fafafa;text-transform:uppercase;letter-spacing:.03em;margin:0;text-align:center;}
  .auth-sub{font-size:12px;color:var(--muted2);text-align:center;margin:-6px 0 0;}
  .auth-form{width:100%;display:flex;flex-direction:column;gap:10px;}
  .auth-error{font-size:12px;color:#fb923c;text-align:center;margin:0;}
  .auth-success{font-size:12px;color:var(--lime);text-align:center;margin:0;}
  .auth-link{font-size:12px;color:var(--muted2);text-align:center;background:none;border:none;text-decoration:underline;cursor:pointer;padding:4px;}
  .trainer-topbar{display:flex;align-items:center;justify-content:space-between;padding:12px 16px 0;gap:8px;}
  .topbar-actions{display:flex;gap:6px;flex-shrink:0;}
  .recovery-question{font-size:13px;color:#e4e4e7;background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:10px 12px;text-align:center;}

  .editor-tabs{display:flex;gap:6px;padding:2px 4px;}
  .editor-tab{position:relative;flex:1;font-size:12px;font-weight:700;color:var(--muted2);background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:9px 4px;cursor:pointer;text-align:center;}
  .editor-tab.active{color:#09090b;background:var(--lime);border-color:var(--lime);}
  .chat-badge{position:absolute;top:-6px;right:-6px;background:var(--orange);color:#fff;font-size:10px;font-weight:800;border-radius:999px;min-width:16px;height:16px;display:flex;align-items:center;justify-content:center;padding:0 4px;}

  .pdf-name-row{display:flex;align-items:center;justify-content:space-between;padding:0 4px 8px;}
  .pdf-frame{width:100%;height:520px;border:1px solid var(--border);border-radius:12px;background:#fff;}

  .chat-wrap{display:flex;flex-direction:column;height:520px;}
  .chat-messages{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:4px;}
  .chat-bubble{max-width:78%;font-size:14px;line-height:1.35;padding:9px 12px;border-radius:14px;word-break:break-word;}
  .chat-bubble.theirs{align-self:flex-start;background:var(--surface2);border:1px solid var(--border);color:#e4e4e7;border-bottom-left-radius:4px;}
  .chat-bubble.mine{align-self:flex-end;background:var(--lime);color:#09090b;border-bottom-right-radius:4px;}
  .chat-input-row{display:flex;gap:8px;padding-top:8px;align-items:center;}
  .chat-input-row .form-input{flex:1;}
  .chat-input-row .icon-btn{background:var(--surface2);border:1px solid var(--border);}

  .lightbox-overlay{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:999;display:flex;align-items:center;justify-content:center;padding:24px;}
  .lightbox-overlay img{max-width:100%;max-height:100%;border-radius:12px;object-fit:contain;}
  .lightbox-close{position:absolute;top:18px;right:18px;background:var(--surface2);border:1px solid var(--border);color:#fff;border-radius:999px;padding:8px;cursor:pointer;}

  .rest-timer{display:flex;align-items:center;gap:12px;background:var(--surface2);border:1px solid var(--lime);border-radius:14px;padding:12px;margin:10px 4px;}
  .rest-timer.finished{border-color:var(--orange);background:rgba(255,122,26,.12);}
  .rest-timer-ring{position:relative;width:44px;height:44px;flex-shrink:0;}
  .rest-timer-ring svg{width:44px;height:44px;transform:rotate(-90deg);}
  .rt-bg{fill:none;stroke:var(--border);stroke-width:4;}
  .rt-fg{fill:none;stroke:var(--lime);stroke-width:4;stroke-linecap:round;transition:stroke-dashoffset 1s linear;}
  .rest-timer.finished .rt-fg{stroke:var(--orange);}
  .rt-time{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;color:#fff;}
  .rest-timer-info{flex:1;min-width:0;}
  .rt-label{font-size:12.5px;font-weight:600;color:#e4e4e7;margin:0 0 6px 0;}
  .rt-actions{display:flex;gap:6px;}
  .rt-btn{font-size:11px;font-weight:700;color:#e4e4e7;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:6px 10px;cursor:pointer;}

  .save-error-banner{display:flex;align-items:center;gap:8px;background:rgba(255,92,92,.12);border:1px solid #ff5c5c;color:#ffb4b4;border-radius:10px;padding:10px 12px;margin:8px 4px;font-size:12.5px;line-height:1.4;}
  .save-error-banner svg{width:16px;height:16px;flex-shrink:0;}

  @media (max-width: 480px), (display-mode: standalone){
    .wrap{padding:0;min-height:100dvh;align-items:stretch;}
    .phone{max-width:100%;height:100dvh;border:none;border-radius:0;box-shadow:none;}
    .notch-row{display:none;}
    .header{padding-top:max(10px, env(safe-area-inset-top));}
    .content{padding-bottom:env(safe-area-inset-bottom);}
  }
</style>
</head>
<body>
<div id="root"></div>

   Claves marcadas "shared" (usuarios, rutinas, progreso, comentarios,
   pesos, chats) se guardan en Cloud Firestore — así el entrenador y
   cada cliente ven lo mismo en tiempo real, sin importar si abren la
   app dentro de Claude o como página publicada (GitHub/Vercel/etc).

var FIREBASE_PROJECT_ID = 'sebatrainer';
var FIREBASE_API_KEY = 'AIzaSyBLapoCoHWzVrEuRijDjOQiatMSXIB0jp0';
var FIRESTORE_BASE = 'https://firestore.googleapis.com/v1/projects/' + FIREBASE_PROJECT_ID + '/databases/(default)/documents/sebatrainer/';

var usingLocalStorage = false;
try { usingLocalStorage = typeof localStorage !== 'undefined'; } catch(e){ usingLocalStorage = false; }
var usingRealStorage = true;
var memoryStore = {};

async function firestoreGet(key){
  try {
    var res = await fetch(FIRESTORE_BASE + encodeURIComponent(key) + '?key=' + FIREBASE_API_KEY);
    if (res.status === 404) return null;
    if (!res.ok) return null;
    var data = await res.json();
    return (data.fields && data.fields.value && data.fields.value.stringValue !== undefined) ? data.fields.value.stringValue : null;
  } catch(e){ return null; }
}
async function firestoreSet(key, value){
  try {
    var body = { fields: { value: { stringValue: value }, updatedAt: { integerValue: String(Date.now()) } } };
    var res = await fetch(FIRESTORE_BASE + encodeURIComponent(key) + '?key=' + FIREBASE_API_KEY, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    return res.ok;
  } catch(e){ return false; }
}
async function firestoreDelete(key){
  try {
    var res = await fetch(FIRESTORE_BASE + encodeURIComponent(key) + '?key=' + FIREBASE_API_KEY, { method: 'DELETE' });
    return res.ok;
  } catch(e){ return false; }
}

async function storageGet(key, shared){
  if (shared){
    var v = await firestoreGet(key);
    if (v !== null) return v;
    if (window.storage){ try { var r = await window.storage.get(key, true); return r ? r.value : null; } catch(e){} }
    return null;
  }
  if (window.storage){
    try { var r2 = await window.storage.get(key, false); if (r2) return r2.value; } catch(e){}
  }
  if (usingLocalStorage){
    try { return localStorage.getItem(STORAGE_PREFIX+key); } catch(e){}
  }
  return (key in memoryStore) ? memoryStore[key] : null;
}
async function storageSet(key, value, shared){
  if (shared){
    var ok = await firestoreSet(key, value);
    if (window.storage){ try { await window.storage.set(key, value, true); } catch(e){} }
    return ok;
  }
  if (window.storage){
    try { await window.storage.set(key, value, false); return true; } catch(e){}
  }
  if (usingLocalStorage){
    try { localStorage.setItem(STORAGE_PREFIX+key, value); return true; } catch(e){}
  }
  memoryStore[key] = value;
  return true;
}
async function storageDelete(key, shared){
  if (shared){
    var ok = await firestoreDelete(key);
    if (window.storage){ try { await window.storage.delete(key, true); } catch(e){} }
    return ok;
  }
  if (window.storage){
    try { await window.storage.delete(key, false); return true; } catch(e){}
  }
  if (usingLocalStorage){
    try { localStorage.removeItem(STORAGE_PREFIX+key); return true; } catch(e){}
  }
  delete memoryStore[key];
  return true;
}

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function emptyRoutine(){
  return { days: DAY_NAMES.map(function(name,i){ return { id:'day-'+i, name:name, exercises: [] }; }) };
}
function countExercises(routine){
  if (!routine) return 0;
  return routine.days.reduce(function(sum, d){ return sum + d.exercises.length; }, 0);
}
function normalizeAnswer(a){ return String(a||'').trim().toLowerCase(); }
function isEditingSomething(){
  var el = document.activeElement;
  if (!el) return false;
  var tag = el.tagName;
  return tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT';
}

function b64EncodeUnicode(str){
  return btoa(encodeURIComponent(str).replace(/%([0-9A-F]{2})/g, function(match, p1){ return String.fromCharCode(parseInt(p1,16)); }));
}
function b64DecodeUnicode(str){
  return decodeURIComponent(atob(str).split('').map(function(c){ return '%'+('00'+c.charCodeAt(0).toString(16)).slice(-2); }).join(''));
}

function simpleHash(str){
  var hash = 5381;
  for (var i=0;i<str.length;i++){ hash = ((hash<<5)+hash) + str.charCodeAt(i); hash = hash|0; }
  return 's' + Math.abs(hash).toString(36) + str.length.toString(36);
}
async function hashPassword(pw){
  try {
    if (window.crypto && window.crypto.subtle){
      var enc = new TextEncoder().encode('rutina-salt-' + pw);
      var buf = await window.crypto.subtle.digest('SHA-256', enc);
      return Array.from(new Uint8Array(buf)).map(function(b){ return b.toString(16).padStart(2,'0'); }).join('');
    }
  } catch(e){}
  return simpleHash(pw);
}

function compressImage(file){
  return new Promise(function(resolve, reject){
    var reader = new FileReader();
    reader.onload = function(e){
      var img = new Image();
      img.onload = function(){
        var maxW = 480;
        var scale = Math.min(1, maxW / img.width);
        var canvas = document.createElement('canvas');
        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);
        var ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL('image/jpeg', 0.7));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

/* ---------------- persistence (shared = visible live to everyone using this app link) ----------------
   Nota: la rutina de cada cliente se guarda en SU PROPIO documento
   ("routines-v1:<id-del-cliente>"), no todas juntas en un solo lugar.
   Así, aunque un cliente tenga muchas fotos, no arriesga los datos de
   los demás ni choca con el límite de tamaño de un solo documento. */
async function persistRoutines(userId){
  var uid_ = userId || state.trainerEditingUserId;
  if (!uid_) return;
  var routine = state.routines[uid_] || emptyRoutine();
  var ok = await storageSet('routines-v1:' + uid_, JSON.stringify(routine), true);
  if (ok === false){
    state.saveError = 'No se pudo guardar. Puede que una foto o el PDF de la pauta sean muy pesados — probá con un archivo más liviano.';
  } else {
    state.saveError = null;
    state.savedFlash = true;
    setTimeout(function(){ state.savedFlash = false; render(); }, 1200);
  }
  render();
}
async function persistUsers(){ await storageSet('users-v1', JSON.stringify(state.users), true); }
async function persistProgress(){ await storageSet('progress-v2', JSON.stringify(state.progress), true); }
async function persistComments(){ await storageSet('comments-v1', JSON.stringify(state.comments), true); }
async function persistWeights(){ await storageSet('weights-v1', JSON.stringify(state.weights), true); }
async function persistChats(){ await storageSet('chats-v1', JSON.stringify(state.chats), true); }

function ensureRoutine(userId){
  if (!state.routines[userId]) state.routines[userId] = emptyRoutine();
  return state.routines[userId];
}

var MAX_PDF_BASE64_CHARS = 650000; /* ~650KB en base64, deja margen bajo el límite de 1MB de Firestore */
function setTrainerEditorTab(tab){ state.trainerEditorTab = tab; scrollToTopNext(); render(); }
function handlePdfInput(input){
  var file = input.files && input.files[0];
  if (!file) return;
  if (file.type !== 'application/pdf'){ alert('Por favor selecciona un archivo PDF.'); return; }
  var reader = new FileReader();
  reader.onload = function(e){
    if (e.target.result.length > MAX_PDF_BASE64_CHARS){
      alert('Este PDF es muy pesado para guardarlo (máximo aprox. 450KB). Probá comprimirlo o exportarlo con menos calidad de imagen antes de subirlo.');
      return;

    var routine = ensureRoutine(state.trainerEditingUserId);
    routine.dietPdf = e.target.result;
    routine.dietPdfName = file.name;
    state.routines[state.trainerEditingUserId] = routine;
    persistRoutines(state.trainerEditingUserId);
    render();
  };
  reader.readAsDataURL(file);
}

/* ---------------- live sync: poll shared data ---------------- */
var lastInteractionAt = 0;
var INTERACTION_GRACE_MS = 3000; /* no interrumpir la pantalla justo después de tocar/escribir algo */
document.addEventListener('touchstart', function(){ lastInteractionAt = Date.now(); }, { capture:true, passive:true });
document.addEventListener('focusin', function(){ lastInteractionAt = Date.now(); }, { capture:true });
document.addEventListener('input', function(){ lastInteractionAt = Date.now(); }, { capture:true });

async function pollSharedData(){
  if (!usingRealStorage) return;
  if (isEditingSomething()) return;
  if (Date.now() - lastInteractionAt < INTERACTION_GRACE_MS) return;
  try {
    var uu = await storageGet('users-v1', true);
    var pp = await storageGet('progress-v2', true);
    var cc = await storageGet('comments-v1', true);
    var ww = await storageGet('weights-v1', true);
    var chch = await storageGet('chats-v1', true);
    var sd = await storageGet('setsdone-v1', true);
    var changed = false;
    if (uu){ var newUsers = JSON.stringify(state.users); if (uu !== newUsers){ state.users = JSON.parse(uu); changed = true; } }
    if (pp){ var newProg = JSON.stringify(state.progress); if (pp !== newProg){ state.progress = JSON.parse(pp); changed = true; } }
    if (cc){ var newComments = JSON.stringify(state.comments); if (cc !== newComments){ state.comments = JSON.parse(cc); changed = true; } }
    if (ww){ var newWeights = JSON.stringify(state.weights); if (ww !== newWeights){ state.weights = JSON.parse(ww); changed = true; } }
    if (chch){ var newChats = JSON.stringify(state.chats); if (chch !== newChats){ state.chats = JSON.parse(chch); changed = true; } }
    if (sd){ var newSetsDone = JSON.stringify(state.setsDone); if (sd !== newSetsDone){ state.setsDone = JSON.parse(sd); changed = true; } }

    if (!state.addingToDay && !state.editingExercise){
      var results = await Promise.all(state.users.map(function(u){
        return storageGet('routines-v1:' + u.id, true).then(function(v){ return { id: u.id, value: v }; });
      }));
      results.forEach(function(r){
        if (r.value === null) return;
        var current = JSON.stringify(state.routines[r.id] || null);
        if (r.value !== current){
          state.routines[r.id] = JSON.parse(r.value);
          changed = true;
        }
      });
    }
    if (changed) render();
  } catch(e){}
}

  var el = document.getElementById('share-code-text');
  if (!el) return;
  el.focus(); el.select();
  try { el.setSelectionRange(0, 999999); } catch(e){}
  var copied = false;
  try {
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(el.value);
      copied = true;
    }
  } catch(e){}
  if (!copied){
    try { document.execCommand('copy'); } catch(e){}
  }
  state.shareCopiedFlash = true; render();
  setTimeout(function(){ state.shareCopiedFlash = false; render(); }, 1600);
}

  var raw = document.getElementById('import-code-text').value.trim();
  state.importError = '';
  if (!raw){ state.importError = 'Pega el código primero.'; render(); return; }
  var payload;
  try { payload = JSON.parse(b64DecodeUnicode(raw)); } catch(e){ state.importError = 'Código inválido o incompleto.'; render(); return; }
  if (!payload || !payload.user || !payload.routine || !payload.user.username){
    state.importError = 'Código inválido o incompleto.'; render(); return;
  }
  var incoming = payload.user;
  var existingIdx = state.users.findIndex(function(u){ return u.username.toLowerCase()===incoming.username.toLowerCase(); });
  var finalId;
  if (existingIdx >= 0){
    finalId = state.users[existingIdx].id;
    state.users[existingIdx] = Object.assign({}, incoming, { id: finalId });
  } else {
    finalId = incoming.id || uid();
    state.users.push(Object.assign({}, incoming, { id: finalId }));
  }
  state.routines[finalId] = payload.routine;
  persistUsers();
  persistRoutines(finalId);
  state.importMode = false;
  selectUser(finalId);
}

function saveExercise(){
  var nameEl = document.getElementById('draft-name');

  var name = nameEl.value.trim();
  if (!name) return;
  var series = document.getElementById('draft-series').value.trim();
  var reps = document.getElementById('draft-reps').value.trim();
  var descansoSel = document.getElementById('draft-descanso').value;

    ? (document.getElementById('draft-descanso-custom').value.trim() || '')
    : descansoSel;

    var ex = { id: uid(), name: name, series: series, reps: reps, descanso: descanso, notas: notas, photo: photo };
    routine.days = routine.days.map(function(d){
      return d.id===dayId ? Object.assign({}, d, { exercises: d.exercises.concat([ex]) }) : d;
    });
    state.addingToDay = null;
  } else if (state.editingExercise){
    var edId = state.editingExercise.dayId, exId = state.editingExercise.exId;
    routine.days = routine.days.map(function(d){
      if (d.id !== edId) return d;
      return Object.assign({}, d, {
        exercises: d.exercises.map(function(e){
          return e.id===exId ? Object.assign({}, e, { name:name, series:series, reps:reps, descanso:descanso, notas:notas, photo:photo }) : e;
        })
      });
    });
    state.editingExercise = null;

  state.pendingPhoto = null;
  persistRoutines(state.trainerEditingUserId);
  render();

async function persistSetsDone(){ await storageSet('setsdone-v1', JSON.stringify(state.setsDone), true); }
function toggleSetDone(dayId, exId, setIdx){
  if (!state.activeUserId) return;
  var userId = state.activeUserId;
  if (!state.setsDone[userId]) state.setsDone[userId] = {};
  if (!state.setsDone[userId][dayId]) state.setsDone[userId][dayId] = {};
  if (!state.setsDone[userId][dayId][exId]) state.setsDone[userId][dayId][exId] = [];
  var arr = state.setsDone[userId][dayId][exId];
  var willBeDone = !arr[setIdx];
  arr[setIdx] = willBeDone;
  persistSetsDone();

  if (willBeDone){
    startRestTimer(dayId, exId);
    /* Si con esta serie ya se completaron todas, marcamos el ejercicio entero como hecho */
    var routine = state.routines[userId];
    var day = routine && routine.days.find(function(d){ return d.id===dayId; });
    var ex = day && day.exercises.find(function(e){ return e.id===exId; });
    if (ex){
      var total = getSeriesCount(ex);
      var doneCount = 0;
      for (var i=0; i<total; i++){ if (arr[i]) doneCount++; }
      if (doneCount >= total){
        if (!state.progress[userId]) state.progress[userId] = {};
        if (!state.progress[userId][dayId]) state.progress[userId][dayId] = {};
        if (!state.progress[userId][dayId][exId]){
          state.progress[userId][dayId][exId] = true;
          persistProgress();
        }
      }
    }
  }
  render();
}

function formatSecondsLabel(sec){

  if (sec <= 0) return '';
  if (sec < 60) return sec + ' seg';
  var m = Math.floor(sec/60), s = sec%60;

}

function parseDescansoToSeconds(text){
  if (!text) return 0;
  text = String(text).toLowerCase().trim();
  var mmss = text.match(/^(\d+):(\d{1,2})$/);
  if (mmss) return (parseInt(mmss[1],10)*60) + parseInt(mmss[2],10);
  var totalSeconds = 0;
  var minMatch = text.match(/(\d+(?:[.,]\d+)?)\s*(?:min|m)\b/);
  var secMatch = text.match(/(\d+(?:[.,]\d+)?)\s*(?:seg|sec|s)\b/);
  if (minMatch) totalSeconds += Math.round(parseFloat(minMatch[1].replace(',','.')) * 60);
  if (secMatch) totalSeconds += Math.round(parseFloat(secMatch[1].replace(',','.')));
  if (!minMatch && !secMatch){
    var justNumber = text.match(/(\d+(?:[.,]\d+)?)/);
    if (justNumber) totalSeconds = Math.round(parseFloat(justNumber[1].replace(',','.')));
  }
  return totalSeconds;
}
function findNextExerciseLabel(dayId, exId){
  var routine = state.routines[state.activeUserId];
  if (!routine) return '';
  var day = routine.days.find(function(d){ return d.id===dayId; });
  if (!day) return '';
  var idx = day.exercises.findIndex(function(e){ return e.id===exId; });
  if (idx === -1) return '';
  var next = day.exercises[idx+1];
  return next ? next.name : '';
}
function startRestTimer(dayId, exId){
  var routine = state.routines[state.activeUserId];
  if (!routine) return;
  var day = routine.days.find(function(d){ return d.id===dayId; });
  var ex = day ? day.exercises.find(function(e){ return e.id===exId; }) : null;
  var seconds = ex ? parseDescansoToSeconds(ex.descanso) : 0;
  if (!seconds || seconds <= 0) return;
  if (restTimerInterval) clearInterval(restTimerInterval);
  state.restTimer = {
    dayId: dayId,
    exId: exId,
    total: seconds,
    remaining: seconds,
    exName: ex.name,
    nextName: findNextExerciseLabel(dayId, exId),
    finished: false
  };
  restTimerInterval = setInterval(restTimerTick, 1000);
  render();
}
function restTimerTick(){
  var t = state.restTimer;
  if (!t){ clearInterval(restTimerInterval); restTimerInterval = null; return; }
  t.remaining -= 1;
  if (t.remaining <= 0){
    clearInterval(restTimerInterval);
    restTimerInterval = null;
    t.remaining = 0;
    t.finished = true;
    playRestTimerSound();
    if (navigator.vibrate) navigator.vibrate([300,150,300,150,300]);
    render();
    return;
  }
  updateRestTimerDOM();
}
function updateRestTimerDOM(){
  var t = state.restTimer;
  if (!t) return;
  var timeEl = document.getElementById('rt-time-text');
  var ringEl = document.getElementById('rt-fg-circle');
  if (!timeEl || !ringEl) return; /* no está visible ahora mismo: no pasa nada, el interval sigue igual */
  var mm = Math.floor(Math.max(t.remaining,0)/60);
  var ss = Math.max(t.remaining,0)%60;
  timeEl.textContent = (mm<10?'0':'')+mm+':'+(ss<10?'0':'')+ss;
  var pct = Math.max(0, Math.min(1, t.remaining / t.total));
  ringEl.style.strokeDashoffset = (119.4*(1-pct));
}
function dismissRestTimer(){
  if (restTimerInterval){ clearInterval(restTimerInterval); restTimerInterval = null; }
  state.restTimer = null;
  render();
}
function addRestTimerSeconds(extra){
  if (!state.restTimer) return;
  state.restTimer.remaining += extra;
  state.restTimer.total += extra;
  if (state.restTimer.finished){
    state.restTimer.finished = false;
    restTimerInterval = setInterval(restTimerTick, 1000);
  }
  render();
}
function playRestTimerSound(){
  try {
    var Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return;
    var ctx = new Ctx();
    var startAt = ctx.currentTime;
    [0, 0.35, 0.7].forEach(function(offset){
      var osc = ctx.createOscillator();
      var gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = 880;
      gain.gain.setValueAtTime(0.001, startAt+offset);
      gain.gain.linearRampToValueAtTime(0.35, startAt+offset+0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, startAt+offset+0.28);
      osc.connect(gain).connect(ctx.destination);
      osc.start(startAt+offset);
      osc.stop(startAt+offset+0.3);
    });
  } catch(e){}
}
function renderRestTimerBar(){
  var t = state.restTimer;
  if (!t) return '';
  var mm = Math.floor(Math.max(t.remaining,0)/60);
  var ss = Math.max(t.remaining,0)%60;
  var timeStr = (mm<10?'0':'')+mm+':'+(ss<10?'0':'')+ss;
  var pct = Math.max(0, Math.min(1, t.remaining / t.total));
  var label = t.finished
    ? (t.nextName ? '¡Descanso terminado! Sigue con: '+esc(t.nextName) : '¡Descanso terminado! Sigue con el próximo ejercicio')
    : 'Descansando después de '+esc(t.exName);
  return '<div class="rest-timer'+(t.finished?' finished':'')+'">' +
    '<div class="rest-timer-ring"><svg viewBox="0 0 44 44"><circle class="rt-bg" cx="22" cy="22" r="19"></circle>' +
      '<circle id="rt-fg-circle" class="rt-fg" cx="22" cy="22" r="19" style="stroke-dasharray:119.4;stroke-dashoffset:'+(119.4*(1-pct))+'"></circle></svg>' +
      '<span id="rt-time-text" class="rt-time">'+timeStr+'</span></div>' +
    '<div class="rest-timer-info"><p class="rt-label">'+label+'</p>' +
      '<div class="rt-actions">' +
        (t.finished ? '<button class="rt-btn" onclick="dismissRestTimer()">Listo</button>' :
          '<button class="rt-btn" onclick="addRestTimerSeconds(15)">+15s</button><button class="rt-btn" onclick="dismissRestTimer()">Saltar</button>') +
      '</div>' +
    '</div>' +
  '</div>';
}

/* ---------------- day completion helpers ---------------- */
function dayCompletion(routine, day){
  if (!state.activeUserId) return null;
  var total = day.exercises.length;
  if (total === 0) return null;
  var userProg = state.progress[state.activeUserId] || {};
  var dayProg = userProg[day.id] || {};
  var done = day.exercises.filter(function(e){ return !!dayProg[e.id]; }).length;
  return { done: done, total: total, pct: done/total };
}
function weekTotals(routine){
  if (!state.activeUserId) return { done:0, total:0 };
  var userProg = state.progress[state.activeUserId] || {};
  var done = 0, total = 0;
  routine.days.forEach(function(d){
    total += d.exercises.length;
    var dayProg = userProg[d.id] || {};
    done += d.exercises.filter(function(e){ return !!dayProg[e.id]; }).length;
  });
  return { done: done, total: total };
}

  '<div class="ex-row">' +

    '</div>' +
  '</div>';
}

function renderUserRutinaTab(routine){
  var day = routine.days[state.activeUserDayIndex];
  var comp = dayCompletion(routine, day);
  var totals = weekTotals(routine);

  var html = '<div class="week-card"><div class="week-head"><span class="section-label" style="padding:0">Progreso de la semana</span>' +
    '<span class="ex-meta" style="color:var(--lime)">'+totals.done+'/'+totals.total+'</span></div>' +
    '<div class="week-days">';
  routine.days.forEach(function(d,i){
    var c = dayCompletion(routine, d);
    var hasRoutine = d.exercises.length > 0;
    var filled = c ? c.pct === 1 : false;
    var partial = c ? (c.pct > 0 && c.pct < 1) : false;
    var untouched = hasRoutine && !filled && !partial;
    var cls = 'day-dot' + (i===state.activeUserDayIndex?' active-border':'') + (filled?' filled':'') + (partial?' partial':'') + (untouched?' has-routine':'');
    html += '<button class="'+cls+'" onclick="setActiveUserDay('+i+')">'+DAY_LETTERS[i]+'</button>';
  });
  html += '</div></div>';

  html += '<div><div class="day-title-row"><h2 class="day-title-big">'+esc(day.name)+'</h2>';
  if (comp) html += '<span class="ex-meta">'+comp.done+'/'+comp.total+' hecho</span>';
  html += '</div>';

  if (day.exercises.length === 0){
    html += '<div class="empty-box"><p>Tu entrenador todavía no configuró ejercicios para este día.</p></div>';
  } else {
    html += '<div class="checklist">';
    var userProg = state.progress[state.activeUserId] || {};
    var dayProg = userProg[day.id] || {};
    var userComments = state.comments[state.activeUserId] || {};
    var dayComments = userComments[day.id] || {};
    var userWeights = state.weights[state.activeUserId] || {};
    var dayWeights = userWeights[day.id] || {};
    var userSetsDone = state.setsDone[state.activeUserId] || {};
    var daySetsDone = userSetsDone[day.id] || {};
    day.exercises.forEach(function(ex){
      var checked = !!dayProg[ex.id];
      var thumb = ex.photo ? '<img class="ex-thumb" src="'+ex.photo+'" onclick="event.stopPropagation();openLightbox(\''+ex.photo+'\')" />' : '';
      var descansoLabel = formatSecondsLabel(parseDescansoToSeconds(ex.descanso));
      var meta = esc(ex.series)+' x '+esc(ex.reps)+(descansoLabel?' · descanso '+descansoLabel:'');
      var notes = ex.notas ? '<p class="ex-notes">'+esc(ex.notas)+'</p>' : '';
      var existingComment = dayComments[ex.id] || '';
      var existingWeights = Array.isArray(dayWeights[ex.id]) ? dayWeights[ex.id] : [];
      var existingSetsDone = Array.isArray(daySetsDone[ex.id]) ? daySetsDone[ex.id] : [];
      var seriesCount = getSeriesCount(ex);
      var setsHtml = '';
      for (var si=0; si<seriesCount; si++){
        var sv = existingWeights[si] || '';
        var setDone = !!existingSetsDone[si];
        setsHtml += '<div class="weight-row'+(setDone?' set-done':'')+'">' +
          '<button class="set-check-btn'+(setDone?' on':'')+'" onclick="toggleSetDone(\''+day.id+'\',\''+ex.id+'\', '+si+')">'+(setDone?icon('check'):'')+'</button>' +
          '<label class="weight-label">Serie '+(si+1)+'</label>' +
          '<input class="weight-input" type="text" inputmode="decimal" placeholder="0" value="'+esc(sv)+'" onblur="saveSetWeight(\''+day.id+'\',\''+ex.id+'\', '+si+', this.value)" />' +
          '<span class="weight-unit">kg</span>' +
        '</div>';
      }
      var timerHere = (state.restTimer && state.restTimer.dayId===day.id && state.restTimer.exId===ex.id) ? renderRestTimerBar() : '';
      html += '<div class="check-item'+(checked?' done':'')+'">' +
        '<button class="check-toggle" onclick="toggleCheck(\''+day.id+'\',\''+ex.id+'\')">' +
          '<div class="check-circle'+(checked?' on':'')+'">'+(checked?icon('check'):'')+'</div>' +
          thumb +
          '<div class="check-text"><p class="ex-name'+(checked?' done':'')+'">'+esc(ex.name)+'</p><p class="ex-meta">'+meta+'</p>'+notes+'</div>' +
        '</button>' +
        '<div class="extra-row">' +
          setsHtml +
          timerHere +
          (checked ? '<textarea placeholder="Comentario (opcional): ¿cómo te fue? Tu entrenador lo verá" onblur="saveComment(\''+day.id+'\',\''+ex.id+'\', this.value)" class="comment-input">'+esc(existingComment)+'</textarea>' : '') +
        '</div>' +
      '</div>';
    });
    html += '</div>';
  }
  html += '</div>';

  html += '<div class="reset-row">';
  if (state.resetConfirm){
    html += '<div class="confirm-row"><button class="btn-confirm" onclick="confirmResetWeek()">Confirmar reinicio</button>' +
      '<button class="btn-cancel" onclick="cancelResetWeek()">Cancelar</button></div>';
  } else {
    html += '<button class="btn-reset" onclick="askResetWeek()">'+icon('reset')+' Reiniciar semana</button>';
  }
  html += '</div>';
  return html;
}

    } else if (!state.trainerLoggedIn){
      if (state.recoveryMode === 'trainer-lookup') content += renderTrainerRecoveryLookup();
      else if (state.recoveryMode === 'trainer-answer') content += renderTrainerRecoveryAnswer();
      else content += renderTrainerLogin();
    } else {
      content += state.trainerEditingUserId ? renderTrainerRoutineEditor() : renderTrainerUsers();
    }
  } else {
    if (state.activeUserId){
      content += renderUserView();
    } else if (state.importMode){
      content += renderImportCodeScreen();
    } else if (state.recoveryMode === 'user-lookup'){
      content += renderUserRecoveryLookup();
    } else if (state.recoveryMode === 'user-answer'){
      content += renderUserRecoveryAnswer();
    } else {
      content += renderUserLogin();
    }
  }

  var lightboxHtml = state.lightboxPhoto ? (
    '<div class="lightbox-overlay" onclick="closeLightbox()">' +
      '<button class="lightbox-close" onclick="closeLightbox()">'+icon('x')+'</button>' +
      '<img src="'+state.lightboxPhoto+'" onclick="event.stopPropagation()" />' +
    '</div>'
  ) : '';

  root.innerHTML = '<div class="wrap"><div class="phone">' +
    '<div class="notch-row"><div class="notch"></div></div>' +
    header +
    '<div class="content">' + content + '</div>' +
  '</div></div>' + lightboxHtml;

  var newContentEl = root.querySelector('.content');
  if (newContentEl && savedScrollTop) newContentEl.scrollTop = savedScrollTop;
}

/* ---------------- init ---------------- */
async function init(){
  var u = [], p = {}, c = {}, w = {}, ch = {}, sd = {}, lastUser = null, tAuth = null, tSession = false;
  try { var uu = await storageGet('users-v1', true); if (uu) u = JSON.parse(uu); } catch(e){}
  try { var pp = await storageGet('progress-v2', true); if (pp) p = JSON.parse(pp); } catch(e){}
  try { var cc = await storageGet('comments-v1', true); if (cc) c = JSON.parse(cc); } catch(e){}
  try { var ww = await storageGet('weights-v1', true); if (ww) w = JSON.parse(ww); } catch(e){}
  try { var chch2 = await storageGet('chats-v1', true); if (chch2) ch = JSON.parse(chch2); } catch(e){}
  try { var sdsd = await storageGet('setsdone-v1', true); if (sdsd) sd = JSON.parse(sdsd); } catch(e){}
  try { var lu = await storageGet('active-user-v1', false); if (lu) lastUser = JSON.parse(lu); } catch(e){}
  try { var ta = await storageGet('trainer-auth-v1', false); if (ta) tAuth = JSON.parse(ta); } catch(e){}
  try { var ts = await storageGet('trainer-session-v1', false); if (ts) tSession = JSON.parse(ts); } catch(e){}

  /* Migración: las rutinas se guardaban todas juntas en un solo lugar
     (versión anterior), lo que causaba que se "borraran" al crecer
     demasiado. Ahora cada cliente tiene su propio espacio. Si todavía
     hay datos guardados a la manera antigua, los usamos como respaldo
     y los movemos al nuevo formato la primera vez que carga. */
  var legacyRoutines = null;
  try { var legacy = await storageGet('routines-v1', true); if (legacy) legacyRoutines = JSON.parse(legacy); } catch(e){}

  var routines = {};
  await Promise.all(u.map(function(usr){
    return storageGet('routines-v1:' + usr.id, true).then(function(v){
      if (v){
        routines[usr.id] = JSON.parse(v);
      } else if (legacyRoutines && legacyRoutines[usr.id]){
        routines[usr.id] = legacyRoutines[usr.id];
        storageSet('routines-v1:' + usr.id, JSON.stringify(legacyRoutines[usr.id]), true);
      }
    });
  }));

  state.users = u; state.routines = routines; state.progress = p; state.comments = c; state.weights = w; state.chats = ch; state.setsDone = sd;
  state.trainerAuth = tAuth;
  state.trainerLoggedIn = !!(tAuth && tSession);
  if (lastUser && u.find(function(x){ return x.id===lastUser; })) state.activeUserId = lastUser;
  state.loading = false;
  render();
  if (usingRealStorage) setInterval(pollSharedData, POLL_MS);
}
init();
</script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    });
  }
</script>
